<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adrenaline — звіт зміни</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Adrenaline — звіт зміни</h1>
    <div class="date-row">
      <label>Дата <input id="date" type="date"></label>
      <button id="clearBtn" class="danger">Очистити день</button>
    </div>
  </header>

  <section class="add-box">
    <h2>Додати запис</h2>
    <div class="form-grid">
      <label>Час
        <input id="time" type="time" min="11:00" max="22:59" value="11:00">
      </label>
      <label>Послуга
        <select id="service">
          <option value="car">Машинка</option>
          <option value="ps">PlayStation</option>
          <option value="vr">VR</option>
        </select>
      </label>
      <label>№
        <select id="number"></select>
      </label>
      <label>Сума, ₴
        <select id="price">
          <option>100</option><option>150</option><option selected>200</option>
          <option>300</option><option>500</option><option value="custom">Інша</option>
        </select>
      </label>
      <label id="customWrap" class="hidden">Своя сума
        <input id="customPrice" type="number" min="0" step="10" placeholder="₴">
      </label>
      <label>Оплата
        <select id="payment">
          <option value="cash">Готівка</option>
          <option value="card">Термінал</option>
        </select>
      </label>
      <button id="addBtn" class="add">+ Додати</button>
    </div>
  </section>

  <section class="report">
    <div class="report-head">
      <h2>Таблиця зміни</h2>
      <button id="copyBtn">📋 Скопіювати звіт</button>
    </div>
    <div class="table-wrap">
      <table id="reportTable">
        <thead>
          <tr>
            <th>Час</th>
            <th>Машинки</th>
            <th>PlayStation</th>
            <th>VR</th>
            <th>💵 Готівка</th>
            <th>💳 Термінал</th>
            <th>Разом</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <th>РАЗОМ</th>
            <th id="totalCar">0 ₴</th>
            <th id="totalPs">0 ₴</th>
            <th id="totalVr">0 ₴</th>
            <th id="totalCash">0 ₴</th>
            <th id="totalCard">0 ₴</th>
            <th id="totalAll">0 ₴</th>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="hint">На телефоні таблицю можна просто заскрінити. Дані зберігаються в цьому браузері.</div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
