<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrenaline Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>⚡ Adrenaline</h1>
        <p>Адмін-панель бронювання</p>
    </header>

    <section class="card">
        <h2>Нове бронювання</h2>

        <label>Час</label>
        <div class="time-row">
            <select id="hour"><option value="">Година</option></select>
            <select id="minute"><option value="">Хвилина</option></select>
        </div>

        <label>Послуга</label>
        <div class="service-buttons">
            <button class="service" data-service="car">🏎️ Машинка</button>
            <button class="service" data-service="vr">🥽 VR</button>
            <button class="service" data-service="ps">🎮 PlayStation</button>
        </div>

        <div id="resourceBlock" class="hidden">
            <label>Номер</label>
            <div id="resources" class="resource-buttons"></div>
        </div>

        <div id="priceBlock" class="hidden">
            <label>Ціна</label>
            <div id="prices" class="price-buttons"></div>
            <div id="customPriceBlock" class="hidden">
                <input type="number" id="customPrice" placeholder="Введіть суму" min="0">
            </div>
        </div>

        <div id="paymentBlock" class="hidden">
            <label>Оплата</label>
            <div class="payment-buttons">
                <button class="payment" data-payment="cash">💵 Готівка</button>
                <button class="payment" data-payment="terminal">💳 Термінал</button>
            </div>
        </div>

        <button id="addBooking" class="add-button">➕ Додати бронювання</button>
    </section>

    <section class="card">
        <h2>📋 Бронювання</h2>
        <div id="bookings"></div>
        <div id="emptyMessage" class="empty">Поки що бронювань немає</div>
    </section>

    <section class="stats">
        <div class="stat"><span>💵 Готівка</span><strong id="cashTotal">0 ₴</strong></div>
        <div class="stat"><span>💳 Термінал</span><strong id="terminalTotal">0 ₴</strong></div>
        <div class="stat total"><span>💰 Разом</span><strong id="total">0 ₴</strong></div>
    </section>

    <button id="clearDay" class="clear-button">🗑️ Очистити день</button>
</div>
<script src="script.js"></script>
</body>
</html>
