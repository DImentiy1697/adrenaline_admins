<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrenaline — Бронювання</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>📋 Бронювання</h1>
        <p>Adrenaline Admin</p>
      </div>
      <button id="clearDay" class="danger">🗑 Очистити день</button>
    </header>

    <section class="panel form-panel">
      <h2>➕ Додати бронювання</h2>

      <div class="form-grid">
        <label>Час
          <div class="time-row">
            <select id="hour"></select>
            <select id="minute"></select>
          </div>
        </label>

        <label>Послуга
          <select id="service">
            <option value="car">🏎️ Машинка</option>
            <option value="ps">🎮 PlayStation</option>
            <option value="vr">🥽 VR</option>
          </select>
        </label>

        <label>Ресурс
          <select id="resource"></select>
        </label>

        <label>Ціна
          <select id="price">
            <option value="200">200 ₴</option>
            <option value="300">300 ₴</option>
            <option value="500">500 ₴</option>
            <option value="custom">Інша сума</option>
          </select>
          <input id="customPrice" type="number" min="0" placeholder="Сума, ₴" hidden>
        </label>

        <label>Оплата
          <select id="payment">
            <option value="cash">💵 Готівка</option>
            <option value="terminal">💳 Термінал</option>
          </select>
        </label>

        <button id="addBooking" class="primary">Додати</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>📊 Таблиця бронювань</h2>
        <span id="dateLabel"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Час</th>
              <th>Послуга</th>
              <th>Ресурс</th>
              <th>Сума</th>
              <th>Оплата</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bookingsBody"></tbody>
        </table>
        <div id="empty" class="empty">Поки немає бронювань</div>
      </div>
    </section>

    <section class="stats">
      <div><span>💵 Готівка</span><strong id="cashTotal">0 ₴</strong></div>
      <div><span>💳 Термінал</span><strong id="terminalTotal">0 ₴</strong></div>
      <div><span>💰 Разом</span><strong id="grandTotal">0 ₴</strong></div>
      <div><span>📋 Бронювань</span><strong id="count">0</strong></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
